[package]
name = "dorobot-studio"
version.workspace = true
edition = "2021"

[[bin]]
name = "dorobot-studio"
path = "src/main.rs"

[dependencies]
dorobot-types = { workspace = true }
dorobot-dora-bridge = { workspace = true }

makepad-widgets = { workspace = true }
# The shared visual language, same crate dorobot-nexus's palette tracks.
dorobot-ux = { workspace = true }
# The panel shell: draggable, resizable, dockable panels, and the theme hook
# that lets this app supply its own palette to the shell chrome.
makepad-app-shell = { workspace = true }

parking_lot = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

# Data loading
parquet = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# File dialogs
rfd = { workspace = true }

# Video decoding (optional - requires FFmpeg installed)
ffmpeg-next = { workspace = true, optional = true }

# URDF visualization (optional)
kiss3d = { workspace = true, optional = true }
urdf-rs = { workspace = true, optional = true }
mesh-loader = { workspace = true, optional = true }

[features]
default = []
# The old dashboard can stream to a Rerun viewer. Off by default: rerun is by
# far the heaviest dependency here, and the player does not use it.
rerun = ["dorobot-dora-bridge/rerun"]
video = ["ffmpeg-next"]
urdf = ["kiss3d", "urdf-rs", "mesh-loader"]

[target.'cfg(target_os = "android")'.dependencies]
robius-android-env = "0.1.0"
