[package]
name = "dorobot-nav-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Dora node that publishes DORA_NAV state to Studio over Zenoh (dviz protocol)"

[dependencies]
dora-node-api = "=1.1.0"
zenoh = { version = "=1.10.2", default-features = false, features = ["transport_tcp"] }
dviz-protocol = { path = "../../crates/dviz-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Own workspace: not part of the Studio root workspace or runtime/.
[workspace]
