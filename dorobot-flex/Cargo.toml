[package]
name = "dorobot-flex"
default-run = "dorobot-flex"
version.workspace = true
edition = "2021"
description = "DoRobot Studio plugin workbench"

[dependencies]
dorobot-studio-core = { path = "../crates/dorobot-studio-core", default-features = false }
dorobot-studio-plugin = { path = "../crates/dorobot-studio-plugin" }
dorobot-plugin-collection = { path = "../plugins/collection" }
dorobot-plugin-aisle = { path = "../plugins/aisle" }
dorobot-plugin-policy = { path = "../plugins/policy" }
dorobot-plugin-control = { path = "../plugins/control" }
dorobot-plugin-diagnostics = { path = "../plugins/diagnostics" }
dorobot-ux = { workspace = true }
makepad-widgets = { workspace = true }
makepad-urdf-player = { git = "https://github.com/dorobot-org/makepad-urdf-viewer", rev = "283d303df6d3e158bac2c281a190ac1f749b5bd5" }
log = { workspace = true }
env_logger = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["video"]
video = ["dorobot-studio-core/video"]

[dev-dependencies]
urdf-rs = "0.9"
